url: https://statmodels7.github.io/optimizers7

template:
  bootstrap: 5
  bslib:
    primary: "#0F2A3F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Optimization algorithms as reusable objects
  description: >
    Optimizers written once, as objects that any package can use: the
    algorithm and its safeguards in one object, the stopping rule in a second
    object that the user can replace or write, and the objective as an
    ordinary function or as an object with a registered method.

navbar:
  structure:
    left:  [reference, articles]
    right: [search, book, statmodels7, github]
  components:
    book:
      text: book
      href: https://statmodels7.github.io/book/
    statmodels7:
      text: statmodels7
      href: https://statmodels7.github.io

reference:
- title: Running an optimization
  desc: >
    One generic for every algorithm. The kind of objective is handled
    separately, by `as_objective()`, so an algorithm is written once.
  contents:
  - minimize
  - maximize
  - optimizer_result

- title: Smooth problems
  desc: >
    Methods that use derivatives of the objective. They are fast when the
    objective is smooth, and they cannot certify a solution at a kink.
  contents:
  - newton
  - chebyshev
  - bfgs
  - lbfgs
  - cg
  - bb
  - gd

- title: Noisy and large problems
  desc: >
    Adam, which tolerates a gradient that points downhill only on average. It
    draws no minibatches of its own: an objective that resamples is a closure
    written by the caller, who defines what an observation is.
  contents:
  - adam

- title: Problems with a kink
  desc: >
    Methods for objectives with kinks, at which a descent method reaches the
    solution without being able to certify it, because the subgradient that
    it evaluates does not become small. `bundle()` tests whether zero lies in
    the convex hull of its subgradients, `prox_grad()` handles the kink
    through a proximal operator, and `nelder_mead()` and `compass()` use no
    derivative.
  contents:
  - bundle
  - prox_grad
  - nelder_mead
  - compass

- title: One parameter
  desc: >
    A function of one variable, minimized without derivatives by bracketing
    the minimum and reducing the bracket.
  contents:
  - brent

- title: Searching before descending
  desc: >
    A global search for problems on which the answer depends on the basin in
    which the run begins. Its result is meant to be passed to a local method,
    which finds the minimum.
  contents:
  - sa

- title: Wrapping an optimizer
  desc: >
    Both are themselves optimizers, so they combine with every method above
    and with each other. A multi-start reports the number of distinct optimal
    values reached from its starts; a chain runs its stages in order, each
    starting where the previous one finished.
  contents:
  - multistart
  - chain

- title: Stopping rules
  desc: >
    A criterion is an object that implements one generic, so a user-defined
    rule is treated like a shipped one. An optimizer rejects a rule that it
    cannot evaluate instead of accepting one that never fires.
  contents:
  - criterion
  - crit_met
  - crit_needs
  - crit_grad
  - crit_abs_obj
  - crit_rel_obj
  - crit_abs_par
  - crit_rel_par
  - crit_stationary
  - crit_never
  - crit_any
  - crit_all

- title: Line searches
  desc: >
    How far to go along a direction, once the direction is chosen. The
    nonmonotone search is the default of the Barzilai-Borwein method, whose
    step length is the method itself and which relies on steps that increase
    the objective.
  contents:
  - line_search
  - armijo
  - wolfe
  - nonmonotone

- title: Starting values
  desc: >
    A starter takes the place of the vector of starting values and is
    resolved on the unconstrained scale, so a single constant gives a
    sensible value for every kind of parameter and every draw lies inside its
    bounds.
  contents:
  - starter-class
  - start_zeros
  - start_runif
  - starting_values
  - infer_npar

- title: The objective
  desc: >
    A function of the parameter vector. The generic is the extension point: a
    caller with another kind of objective registers one method and every
    algorithm accepts that objective.
  contents:
  - as_objective

- title: Writing a new optimizer
  desc: >
    The requirements on a new `minimize()` method, and the functions that help
    to meet them. `check_optimizer()` runs twelve checks on what an optimizer
    reports, and reports separately the gaps that it reaches on the test
    problems, since performance and correctness are different questions.
  contents:
  - optimizer
  - check_criterion
  - check_bounds
  - optimizer_provides
  - optimizer_bounded
  - bounded_transform
  - bounded_forward
  - check_optimizer
  - test_problems
