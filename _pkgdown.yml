url: https://statmodels7.github.io/optimizers7

template:
  bootstrap: 5
  bslib:
    primary: "#0F2A3F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Optimization algorithms as reusable objects
  description: >
    Optimizers written once, as objects any package can use: the algorithm and
    its safeguards in one object, the stopping rule in another you can replace
    or write yourself, and the objective in whichever of three shapes you
    already have it.

navbar:
  structure:
    left:  [reference, articles]
    right: [search, book, statmodels7, github]
  components:
    book:
      text: book
      href: https://statmodels7.github.io/book/
    statmodels7:
      text: statmodels7
      href: https://statmodels7.github.io

reference:
- title: Running an optimization
  desc: >
    One generic for every algorithm. Which of the three shapes the objective
    arrived in is settled separately, so an algorithm is written once.
  contents:
  - minimize
  - maximize
  - optimizer_result

- title: Smooth problems
  desc: >
    Methods that build a model of the surface from derivatives. Fast when the
    objective is smooth, and misled when it is not.
  contents:
  - newton
  - bfgs
  - lbfgs
  - cg
  - bb
  - gd

- title: Noisy and large problems
  desc: >
    Adam, which tolerates a gradient that points downhill only on average. It
    draws no minibatches of its own: an objective that resamples is a closure,
    written by the caller, who knows what an observation is.
  contents:
  - adam

- title: Problems with a kink
  desc: >
    Where a descent method arrives at the answer and cannot certify it, because
    the subgradient it evaluates never becomes small.
  contents:
  - bundle
  - prox_grad
  - nelder_mead
  - compass

- title: Searching before descending
  desc: >
    A global search for the problems where the answer depends on which basin
    the run began in. It is meant to hand its result to a local method rather
    than to finish the job itself.
  contents:
  - sa

- title: Wrapping an optimizer
  desc: >
    Both are themselves optimizers, so they compose with everything above and
    with each other. Multi-start reports what a single run cannot, the number
    of distinct optima; a chain runs its stages in order, each starting where
    the previous finished.
  contents:
  - multistart
  - chain

- title: Stopping rules
  desc: >
    A criterion is an object implementing one generic, so a user-defined rule
    is treated like a shipped one. An optimizer rejects a rule it cannot
    evaluate rather than accepting one that never fires.
  contents:
  - criterion
  - crit_met
  - crit_needs
  - crit_grad
  - crit_abs_obj
  - crit_rel_obj
  - crit_abs_par
  - crit_rel_par
  - crit_stationary
  - crit_never
  - crit_any
  - crit_all

- title: Line searches
  desc: >
    How far to go along a direction, once the direction is chosen. The
    non-monotone rule is not an exotic option: a method whose step length is
    itself the method, as Barzilai-Borwein's is, needs a search that does not
    reshape it.
  contents:
  - line_search
  - armijo
  - wolfe
  - nonmonotone

- title: Starting values
  desc: >
    A starter stands in for the vector of starting values, and is resolved on
    the unconstrained scale, so a single constant means something sensible for
    every kind of parameter and no draw can land outside its bounds.
  contents:
  - start_zeros
  - start_runif
  - starting_values
  - infer_npar

- title: The objective
  desc: >
    A function of the parameter vector. The generic is the extension point: a
    caller with its own kind of objective registers one method and every
    algorithm accepts it.
  contents:
  - as_objective

- title: Writing an optimizer of your own
  desc: >
    What a `minimize()` method of your own has to promise, and the pieces that
    let it. `check_optimizer()` tests the contract; the battery under it reports
    the power; they are separate because they are different questions.
  contents:
  - optimizer
  - check_criterion
  - check_bounds
  - optimizer_provides
  - optimizer_bounded
  - bounded_transform
  - bounded_forward
  - check_optimizer
  - test_problems
